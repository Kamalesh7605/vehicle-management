quarkus.application.name=fleetmate-backend
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=12M

# --- Database (MySQL 8). Credentials come from the environment, never from source. ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fleetmate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# --- CORS (comma separated list of allowed origins) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Location,Content-Disposition

# --- OpenAPI / Swagger UI: http://localhost:8080/q/swagger-ui ---
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=FleetMate API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Vehicle & driver management REST API

# --- FleetMate settings ---
fleetmate.alerts.document-expiry-days=30
fleetmate.alerts.service-due-km=1000
fleetmate.storage.dir=${STORAGE_DIR:./uploads}
fleetmate.seed.enabled=${SEED_DEMO_DATA:true}

# --- Authentication (single admin login; credentials come from the environment) ---
fleetmate.auth.enabled=${AUTH_ENABLED:true}
fleetmate.auth.admin-username=${ADMIN_USERNAME:admin}
fleetmate.auth.admin-password=${ADMIN_PASSWORD:admin}
# At least 32 characters. If empty a random secret is generated at startup (logins end when the backend restarts).
fleetmate.auth.jwt-secret=${JWT_SECRET:}
fleetmate.auth.token-hours=8
quarkus.smallrye-openapi.security-scheme=jwt

# --- Dev / test profiles ---
%dev.quarkus.datasource.username=fleetmate
%dev.quarkus.datasource.password=fleetmate
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:fleetmate;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.fleetmate.seed.enabled=false
%test.fleetmate.auth.enabled=false
%test.fleetmate.storage.dir=target/test-uploads
%test.quarkus.http.test-port=0
